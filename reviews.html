  <link rel="apple-touch-icon" href="/assets/favicon.png" />

<body>

  <!-- ===== Header / Nav =====
       홈과 같은 머리말을 쓴다 (대표 «후기 들어가니 헤더가 사라져버리네 / 디자인스타일이 달라»).
       홈은 어두운 첫 화면 위에 투명하게 얹혔다가 내려가면 흰 바탕이 되는데,
       여기는 첫 화면이 없으므로 처음부터 `scrolled` 를 붙여 흰 바탕으로 둔다.
       칸 주소는 홈 안쪽이라 `/#...` 로 적어야 한다 — `#...` 만 쓰면 이 페이지 안에서 찾다 만다 -->
  <header class="site-header scrolled" id="top">
    <nav class="nav container">
      <a href="/" class="brand">
        <img src="/assets/logo-white.png" alt="온더브라이드" class="brand-logo brand-logo-light" />
        <img src="/assets/logo-black.png" alt="온더브라이드" class="brand-logo brand-logo-dark" />
      </a>
      <button class="nav-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu">
        <li><a href="/#about">소개</a></li>
        <li><a href="/#gallery">갤러리</a></li>
        <li><a href="/reviews" class="on">후기</a></li>
        <li><a href="/#pricing">가격</a></li>
        <li><a href="/#event">이벤트</a></li>
        <li><a href="/blog">블로그</a></li>
        <li><a href="/#contact">문의</a></li>
        <li><a href="/#booking" class="nav-cta">예약하기</a></li>
      </ul>
    </nav>
  </header>

  <main class="rv-page">
    <div class="container">
      <div class="section-head rv-head">
        <h2 class="section-title">신부님 후기</h2>
        <p class="section-desc">촬영을 맡겨주신 신부님들이 직접 남겨주신 이야기입니다.</p>
      </div>

      <!-- 「일반 후기」와 「촬영 후 설문 후기」를 위아래로 갈라 놓는다 (대표 요청 2026-08-27).
           칸을 눌러 바꾸는 방식이 아니라, 한 화면에서 둘 다 보이게 -->
      <div id="rvBody"><p class="rv-empty">불러오는 중입니다…</p></div>

      <!-- 후기를 다 읽고 나면 바로 이어갈 수 있게. 돌아가기만 두면 길이 끊긴다.
           안내 문구는 대표 지시로 뺐다 (2026-08-27) — 내려달라는 길은
           꼬리말 메일 주소와 개인정보처리방침에 그대로 있다 -->
      <div class="rv-cta">
        <a href="/#contact" class="btn btn-primary">예약 문의하기</a>
        <a href="/#pricing" class="btn">가격 보기</a>
        <a href="/#gallery" class="btn">사진 보러 가기</a>
      </div>
    </div>
  </main>

  <!-- 후기 글을 이 자리에서 바로 보여주는 창 (대표 «새창 말고 팝업형식으로 가능?»).
       ⚠ 남의 사이트를 끼워 넣는 것이라 **안 열릴 수 있다.**
       · 네이버 카페는 헤더로 아예 막는다 (x-frame-options: SAMEORIGIN)
       · 블로그는 열리지만 언제 막힐지 모른다
       그래서 못 열면 「새 창으로 열기」로 넘겨준다. 창은 눌렀을 때만 만들므로 평소엔 무게가 0 이다.
       sandbox 에 allow-top-navigation 을 **주지 않는다** — 안 그러면 남의 글이
       우리 페이지를 통째로 자기 쪽으로 끌고 갈 수 있다 -->
  <div class="rv-modal" id="rvModal" hidden>
    <div class="rv-modal-bg" id="rvModalBg"></div>
    <div class="rv-modal-box" role="dialog" aria-modal="true" aria-label="후기 보기">
      <div class="rv-modal-head">
        <p class="rv-modal-t" id="rvModalT"></p>
        <a class="btn-line" id="rvModalOpen" href="#" target="_blank" rel="noopener nofollow">새 창으로 열기 ↗</a>
        <button type="button" class="rv-modal-x" id="rvModalX" aria-label="닫기">&times;</button>
      </div>
      <div class="rv-modal-body">
        <p class="rv-modal-msg" id="rvModalMsg">불러오는 중입니다…</p>
        <iframe id="rvFrame" title="후기" referrerpolicy="no-referrer"
                sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
      </div>
    </div>
  </div>
